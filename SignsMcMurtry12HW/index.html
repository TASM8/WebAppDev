<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Sign up to volunteer!!!</h1> <!--Banner, the header for the page-->

    <form id="form"> <!--Form to fillout-->
        <label for="name">Name:</label>
        <input id="name" type="text" placeholder="Enter your name: ">
        <br>

        <label for="email">Email:</label>
        <input id="email" type="email" placeholder="example@email.com">
        <br>

        <label for="age">Age:</label>
        <input id="age" type="number" min="0" max="105"/>
        <br>

        <label for="message">Message:</label> 
        <textarea id="message" rows="4" cols="50" placeholder="Enter your message here: "></textarea>
        <br>
        
        <button type="submit">Submit</button>
    </form>

    <section id="result">
        <h2>Results</h2> <!--Shows the results of the data entered-->
        <p id="nameResult"></p>
        <p id="emailResult"></p>
        <p id="ageResult"></p>
        <p id="messageResult"></p>
    </section>

    




















    <script src="script.js"></script>
</body>
</html>
